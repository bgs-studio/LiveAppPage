<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Virtual Tour</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-black text-white">
  <header class="text-center p-6">
    <h1 id="tour-title" class="text-3xl font-bold">Loading...</h1>
    <p id="tour-desc" class="text-gray-400"></p>
  </header>
  <a href="index.html" class="fixed top-4 left-4 bg-white text-black px-4 py-2 rounded-full shadow hover:bg-gray-200 transition z-50">
  ← Back to Home
</a>
  <main class="flex justify-center items-center h-[80vh]">
      <iframe id="tour-frame" src="" width="80%" height="500px" frameborder="0" allowfullscreen class="rounded-xl shadow-2xl"></iframe>
    <div class="fixed bottom-4 right-4 flex flex-col gap-2 z-50">
  <button id="like-btn" onclick="likeTour()" class="bg-gray-300 text-black px-4 py-2 rounded-full transition">
  ❤️ Like
  </button>
  <button onclick="shareTour()" class="bg-blue-500 text-white px-4 py-2 rounded-full shadow-lg hover:bg-blue-600 transition">
    🔗 Share
  </button>
</div>  
  </main>

  <script src="assets/js/tours.js"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const tourId = params.get("id");

    if (tours[tourId]) {
      document.getElementById("tour-title").textContent = tours[tourId].title;
      document.getElementById("tour-desc").textContent = tours[tourId].description;
      document.getElementById("tour-frame").src = tours[tourId].url;
    } else {
      document.getElementById("tour-title").textContent = "Tour not found";
    }

    function shareTour() {
    const url = window.location.href;
    navigator.clipboard.writeText(url).then(() => {
      alert("Tour link copied to clipboard!");
    });
  }
  function likeTour() {
  const params = new URLSearchParams(window.location.search);
  const tourId = params.get("id") || "Unknown Tour";

  // Get user approximate location (using IP geolocation API)
  fetch("https://ipapi.co/json")
    .then(res => res.json())
    .then(location => {
      const userLocation = location.city + ", " + location.country;

      // Replace with your form’s actual field entry IDs
      const formURL = "https://docs.google.com/forms/d/e/1FAIpQLSdsOatNZynDCXrLlCQJ4hlnmWRQADNEIrBasA7UFE5YYurBDg/viewform?usp=header";
      const formData = new URLSearchParams();

      formData.append("entry.602749874", tourId);       // Tour ID field
      formData.append("entry.825261193", userLocation); // Location field

      return fetch(formURL, {
        method: "POST",
        mode: "no-cors",
        body: formData
      });
    })
    .then(() => {
      const btn = document.getElementById("like-btn");
      btn.innerText = "✅ Liked";
      btn.classList.remove("bg-gray-300");
      btn.classList.add("bg-green-500", "text-white"); // or "bg-blue-500"
      btn.disabled = true; // optional: prevent repeat clicks
    })
    .catch(() => {
      alert("Like failed. Try again later.");
    });
}
  </script>
</body>
</html>
