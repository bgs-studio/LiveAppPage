
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Virtual Tours</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-gray-900 text-white font-sans">
  <header class="text-center py-12">
    <h1 class="text-5xl font-bold mb-4 animate-fade-in">Explore Gilgit Baltistan</h1>
    <p class="text-lg text-gray-400 animate-fade-in-slow">Click on a tour to start exploring in 360°</p>
  </header>
  <main class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8 p-8">
    <a href="tourPage.html?id=1" class="group transform transition duration-500 hover:scale-105">
      <div class="relative overflow-hidden rounded-2xl shadow-lg">
        <img src="assets/img/Katpana.png" alt="Katpana" class="w-full h-64 object-cover group-hover:blur-sm transition duration-300">
        <div class="absolute inset-0 bg-black bg-opacity-40 flex items-center justify-center opacity-0 group-hover:opacity-100 transition duration-300">
          <p class="text-xl font-semibold">Katpana Lake</p>
        </div>
      </div>
    </a>
    <!-- grid next item -->
  </main>
  <footer class="bg-dark-blue-100 text-white-700 mt-10 border-t border-gray-300 p-6 text-center text-sm">
    <div class="flex flex-col items-center justify-center space-y-2 sm:flex-row sm:space-y-0 sm:space-x-4">
    <!-- Logo -->
    <img src="assets/img/logo.png" alt="Baltistan Gaming Studio Logo" class="w-8 h-8" />

    <!-- Text -->
    <p class="text-white-600">
      Powered by <span class="font-semibold">Baltistan Gaming Studio</span>
    </p>
  </div>

  <p class="mt-4">© 2025 Virtual Tour Gallery. All rights reserved.</p>
  <p>Explore the world's most beautiful destinations — right from your screen.</p>

  <div class="mt-4">
    
    <a href="mailto:baltistanistudio@gmail.com" class="text-blue-600 hover:underline">Contact Us</a>
  </div>
</footer>
</body>
</html>
